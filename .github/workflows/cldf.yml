# Rebuilds the CLDF dataset with cldfbench from raw/ and etc/, validates it and commits the result.
name: cldf
on:
  push:
    paths-ignore: ["cldf/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  makecldf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pylexibank and the dataset
        run: |
          python -m pip install --upgrade pip
          pip install pylexibank pytest pytest-cldf
          pip install -e .
          pip freeze | grep -i -E "pylexibank|cldfbench|pycldf|pyconcepticon|pyglottolog|pyclts|segments|attrs"
      - name: Reference catalogues (pinned releases)
        run: |
          git clone -q --depth 1 --branch v5.4 https://github.com/glottolog/glottolog cat/glottolog
          git clone -q --depth 1 --branch v3.4.0 https://github.com/concepticon/concepticon-data cat/concepticon
          git clone -q --depth 1 --branch v2.3.1 https://github.com/cldf-clts/clts cat/clts
      - name: Make CLDF
        run: cldfbench lexibank.makecldf lexibank_martinvalladolidiberian.py --glottolog cat/glottolog --concepticon cat/concepticon --clts cat/clts
      - name: Validate
        run: |
          cldf validate cldf/cldf-metadata.json
          pytest
      - name: Lexibank checks (informative)
        continue-on-error: true
        run: cldfbench lexibank.check lexibank_martinvalladolidiberian.py --glottolog cat/glottolog --concepticon cat/concepticon --clts cat/clts
      - name: Summary of the generated data
        run: |
          wc -l cldf/*.csv
          head -5 cldf/forms.csv
      - uses: actions/upload-artifact@v4
        with:
          name: cldf
          path: cldf
      - name: Commit the generated CLDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cldf README.md
          git diff --cached --quiet || git commit -m "Rebuild CLDF with cldfbench (automatic)"
          git push
